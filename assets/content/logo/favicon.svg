  <rect x="1" y="1" width="62" height="62" rx="12" fill="#205238" stroke="#163B29" stroke-width="2"/>
  <rect x="6" y="7" width="52" height="31" rx="5" fill="#FAF7F2" stroke="#E6B85C" stroke-width="2"/>
  <g clip-path="url(#roaFaviconFlagClip)">
